services:
  configurator:
    environment:
      PROJECT_CLONE_URL: https://github.com/shelajev/labspace-sbx

  # Placeholder workspace container. The base (labspace-content-dev) wires
  # `workspace` into other services (e.g. host-republisher uses
  # `network_mode: service:workspace`), so it has to exist as a running
  # container — but the learner never interacts with it directly. We use the
  # canonical multi-arch base image (same one tc-go uses) and clear its ports
  # so the host-side ttyd can own :8085. Host and Claude tabs run on the host
  # via the sbx-ttyd provider; VS Code runs in workspace-vscode below.
  workspace:
    image: dockersamples/labspace-workspace-base
    pull_policy: always
    ports: !override []

  # Host-side ttyd wrapping a host zsh, on port 8085. This is what the iframe
  # actually loads — learners need a host shell to run sbx commands against
  # their real machine (the microVM can't govern itself). Replaces the former
  # start-labspace.sh shell script.
  host-terminal:
    provider:
      type: ./providers/sbx-ttyd
      options:
        port: 8085
        shell: zsh
        max-clients: 4

  # Second ttyd on 8086 that drops learners straight into `sbx run claude .`.
  # Paired with the "Claude" tab in labspace.yaml. Each browser connection
  # spawns its own sbx run, so the learner's microVM stays scoped to the tab.
  host-terminal-claude:
    provider:
      type: ./providers/sbx-ttyd
      options:
        port: 8086
        shell: sbx run claude .
        max-clients: 1

  # Containerized VS Code (code-server) for the OpenCode+ACP scenario. Uses the
  # stock labspace-workspace-base image — same one tc-go-labspace extends — so
  # learners get a real VS Code with the labspace project/ mounted. Exposed on
  # :8080 and rendered as its own tab via labspace.yaml.
  workspace-vscode:
    image: dockersamples/labspace-workspace-base
    pull_policy: always
    environment:
      PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      - labspace-content:/home/coder/project

  interface:
    image: ajeetraina777/labspace-interface-sbx:latest
    pull_policy: always
    environment:
      WORKSPACE_TYPE: ttyd
    depends_on:
      - host-terminal
      - host-terminal-claude
      - workspace-vscode
