  - title: "Scenario 1 — Claude in an Isolated Sandbox"
    contentPath: 03-claude-isolated.md
  - title: "Scenario 2 — OpenCode + NVIDIA NIM via ACP"
    contentPath: 04-opencode-nvidia.md
  - title: "Scenario 3 — NanoClaw on Telegram"
    contentPath: 05-nanoclaw-telegram.md
  - title: Wrap-up
