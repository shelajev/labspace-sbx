title: Docker Sandboxes — Three Agent Demos
description: |
  Three hands-on scenarios that show what Docker Sandboxes bring to real
  AI-agent workflows. You'll run Claude Code in an isolated microVM, drive
  OpenCode + NVIDIA NIM from VS Code over the Agent Client Protocol, and
  run a Telegram bot that spawns Claude agents inside Docker-in-Docker —
  all from the same sbx substrate, with proxy-injected secrets and
  default-deny networking.

services:
  - title: Host
    id: host
    url: http://localhost:8085
    icon: terminal
  - title: Claude
    id: claude
    url: http://localhost:8086
    icon: terminal
  - title: VS Code
    id: vscode
    url: http://localhost:8080
    icon: code

sections:
